<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>面板</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-primary: #1e1e1e; --bg-secondary: #252526; --bg-surface: #2d2d2d;
      --text-primary: #cccccc; --text-secondary: #969696; --text-muted: #6a6a6a;
      --border: #3c3c3c; --accent: #007acc; --accent-hover: #1c97ea;
      --green: #4ec9b0; --red: #f44747;
    }
    html, body { width:100%; height:100%; overflow:hidden; font-family:'Segoe UI','Microsoft YaHei',sans-serif; background:var(--bg-primary); color:var(--text-primary); }
    .titlebar { display:flex; align-items:center; justify-content:space-between; height:28px; padding:0 6px 0 10px; background:var(--bg-surface); border-bottom:1px solid var(--border); -webkit-app-region:drag; user-select:none; flex-shrink:0; }
    .titlebar-title { font-size:11px; font-weight:600; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    .titlebar-title .pname { color:var(--accent); }
    .titlebar-controls { display:flex; gap:1px; -webkit-app-region:no-drag; flex-shrink:0; }
    .titlebar-btn { width:22px; height:20px; border:none; background:transparent; color:var(--text-muted); cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center; border-radius:2px; }
    .titlebar-btn:hover { background:var(--bg-secondary); color:var(--text-primary); }
    .titlebar-btn.pinned { color:var(--accent); }
    .titlebar-btn.win-close:hover { background:#e81123; color:#fff; }
    .tb-btn { padding:4px 10px; background:var(--bg-surface); border:1px solid var(--border); color:var(--text-primary); border-radius:3px; cursor:pointer; font-size:11px; }
    .tb-btn:hover { background:var(--bg-hover,#2a2d2e); border-color:var(--accent); }

    body { display:flex; flex-direction:column; }
    .panel-body { flex:1; overflow:hidden; display:flex; flex-direction:column; }

    /* Stage */
    #stage-body { display:flex; align-items:center; justify-content:center; flex:1; background:#11111b; }
    #stage-canvas { background:#fff; border-radius:2px; max-width:100%; height:auto; }

    /* Sprites */
    #sprites-body { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .sprite-toolbar { display:flex; gap:4px; padding:6px 8px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    #sprite-list { flex:1; overflow-y:auto; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; padding:8px; }
    .sprite-thumb { width:64px; height:64px; background:var(--bg-surface); border:2px solid var(--border); border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:20px; cursor:pointer; position:relative; }
    .sprite-thumb:hover { border-color:var(--accent); }
    .sprite-thumb.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .sprite-thumb-name { font-size:9px; color:var(--text-muted); margin-top:2px; max-width:58px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
    .costume-section { padding:6px 8px; border-top:1px solid var(--border); }
    .costume-label { font-size:10px; color:var(--text-muted); margin-bottom:4px; }
    #costume-library { display:grid; grid-template-columns:repeat(auto-fill,minmax(50px,1fr)); gap:4px; max-height:80px; overflow:auto; }

    /* Output */
    #output-body { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    #output-log { flex:1; overflow-y:auto; padding:8px; font-family:'Cascadia Code','Consolas',monospace; font-size:12px; color:var(--text-secondary); white-space:pre-wrap; user-select:text; -webkit-user-select:text; }
    .output-toolbar { display:flex; gap:4px; padding:4px 8px; border-top:1px solid var(--border); }

    /* Audio */
    #audio-body { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .audio-toolbar { display:flex; gap:4px; padding:6px 8px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    #audio-list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:4px; }
    .audio-item { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--bg-surface); border:1px solid var(--border); border-radius:6px; font-size:12px; }
    .audio-item:hover { border-color:var(--accent); }
    .audio-item .audio-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-primary); }
    .audio-item .audio-btn { padding:2px 8px; background:var(--bg-secondary); border:1px solid var(--border); color:var(--text-secondary); border-radius:3px; cursor:pointer; font-size:10px; }
    .audio-item .audio-btn:hover { border-color:var(--accent); color:var(--text-primary); }
    .audio-item .audio-btn.playing { color:var(--green); border-color:var(--green); }
    .audio-item .audio-btn.del { color:var(--red); }
    .audio-empty { text-align:center; color:var(--text-muted); padding:20px; font-size:12px; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-title"><span class="pname" id="pname">未命名项目</span>-<span id="panel-label">面板</span></span>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btn-pin" title="置顶">📌</button>
      <button class="titlebar-btn" id="btn-minimize" title="最小化">─</button>
      <button class="titlebar-btn" id="btn-maximize" title="最大化">□</button>
      <button class="titlebar-btn win-close" id="btn-close" title="关闭">✕</button>
    </div>
  </div>

  <!-- Stage Panel -->
  <div id="stage-body" class="panel-body" style="display:none;">
    <div id="stage-body-inner" style="display:flex;align-items:center;justify-content:center;flex:1;background:#11111b;">
      <canvas id="stage-canvas" width="480" height="360"></canvas>
    </div>
  </div>

  <!-- Sprites Panel -->
  <div id="sprites-body" class="panel-body" style="display:none;">
    <div class="sprite-toolbar">
      <button class="tb-btn" id="btn-add-sprite">+ 添加角色</button>
      <button class="tb-btn" id="btn-upload-costume">⬆ 上传图片</button>
      <button class="tb-btn" id="btn-set-costume">🖼️ 选择造型</button>
      <button class="tb-btn" id="btn-clear-costume">✕ 清除造型</button>
    </div>
    <div id="sprite-list"></div>
    <div class="costume-section">
      <div class="costume-label">🎨 造型库（点击应用，右键删除）</div>
      <div id="costume-library"></div>
    </div>
  </div>

  <!-- Output Panel -->
  <div id="output-body" class="panel-body" style="display:none;">
    <div id="output-log"></div>
    <div class="output-toolbar">
      <button class="tb-btn" id="btn-clear-output">🗑️ 清除</button>
    </div>
  </div>

  <!-- Audio Panel -->
  <div id="audio-body" class="panel-body" style="display:none;">
    <div class="audio-toolbar">
      <button class="tb-btn" id="btn-add-audio">+ 添加音频</button>
      <button class="tb-btn" id="btn-stop-all-audio">⏹ 全部停止</button>
    </div>
    <div id="audio-list">
      <div class="audio-empty">暂无音频文件</div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
