<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Objector 命令行</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      background: #1e1e1e;
      color: #cccccc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #titlebar {
      background: #252526;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-app-region: drag;
      user-select: none;
    }
    .title { font-size: 13px; font-weight: 600; color: #007acc; }
    .controls { display: flex; gap: 8px; -webkit-app-region: no-drag; }
    .controls button {
      width: 24px; height: 24px; border: none; border-radius: 4px;
      cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
    }
    .minimize { background: #dcdcaa; color: #1e1e1e; }
    .close { background: #f44747; color: #ffffff; }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cmd-line { color: #007acc; }
    .cmd-result { color: #4ec9b0; }
    .cmd-error { color: #f44747; }
    .cmd-info { color: #569cd6; }

    #input-area {
      padding: 12px 16px;
      background: #252526;
      border-top: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prompt { color: #007acc; font-weight: 600; }
    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #cccccc;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    #cmd-input::placeholder { color: #6a6a6a; }
  </style>
</head>
<body>
  <div id="titlebar">
    <span class="title">⌨️ Objector 命令行</span>
    <div class="controls">
      <button class="minimize" onclick="window.api?.windowMinimize()">─</button>
      <button class="close" onclick="window.close()">✕</button>
    </div>
  </div>

  <div id="output"></div>

  <div id="input-area">
    <span class="prompt">&gt;&gt;&gt;</span>
    <input id="cmd-input" type="text" placeholder="输入命令 (如 sprite list, run, save)..." autofocus>
  </div>

<script>
const output = document.getElementById('output');
const cmdInput = document.getElementById('cmd-input');

// Command history
let history = [];
let historyIdx = -1;

function print(text, className = '') {
  const line = document.createElement('div');
  if (className) line.className = className;
  line.textContent = text;
  output.appendChild(line);
  output.scrollTop = output.scrollHeight;
}

function printHtml(html, className = '') {
  const line = document.createElement('div');
  if (className) line.className = className;
  line.innerHTML = html;
  output.appendChild(line);
  output.scrollTop = output.scrollHeight;
}

// Show help
function showHelp() {
  print('');
  print('═══ 可用命令 ═══', 'cmd-info');
  print('');
  print('【角色管理】', 'cmd-info');
  print('  sprite add "名字"          添加新角色');
  print('  sprite delete <索引>       删除角色');
  print('  sprite rename <索引> "新名" 重命名角色');
  print('  sprite switch <索引>       切换当前角色');
  print('  sprite list                列出所有角色');
  print('  sprite clone <索引>        克隆角色');
  print('  sprite get_id "名字"       获取角色索引');
  print('  sprite info <索引>         查看角色详情');
  print('  sprite set_pos <索引> <x> <y>  设置位置');
  print('  sprite set_dir <索引> <角度>   设置方向');
  print('  sprite set_size <索引> <百分比> 设置大小');
  print('  sprite set_visible <索引> <0|1> 显示/隐藏');
  print('');
  print('【项目操作】', 'cmd-info');
  print('  run                        运行项目');
  print('  save                       保存项目');
  print('  blocks_count               查看积木数量');
  print('');
  print('【其他】', 'cmd-info');
  print('  help                       显示帮助');
  print('  clear                      清屏');
  print('  history                    显示命令历史');
  print('');
}

// Show welcome message
print('╔══════════════════════════════════════════╗', 'cmd-info');
print('║      ⌨️  Objector 命令行 v1.0.23         ║', 'cmd-info');
print('╚══════════════════════════════════════════╝', 'cmd-info');
print('输入 help 查看可用命令', 'cmd-info');
print('');

// Handle command
async function executeCommand(cmd) {
  const trimmed = cmd.trim();
  if (!trimmed) return;

  // Add to history
  history.push(trimmed);
  historyIdx = history.length;

  // Print command
  print(`>>> ${trimmed}`, 'cmd-line');

  // Special commands
  if (trimmed === 'help') {
    showHelp();
    return;
  }
  if (trimmed === 'clear') {
    output.innerHTML = '';
    return;
  }
  if (trimmed === 'history') {
    print('─── 命令历史 ───', 'cmd-info');
    history.forEach((h, i) => print(`  ${i + 1}. ${h}`));
    return;
  }

  // Execute via IPC
  try {
    const result = await window.api?.aiExecCmd(trimmed);
    if (result && result.startsWith('ERROR:')) {
      print(`❌ ${result.slice(6)}`, 'cmd-error');
    } else {
      print(`✅ ${result}`, 'cmd-result');
    }
  } catch (e) {
    print(`❌ 执行失败: ${e.message}`, 'cmd-error');
  }
}

// Input handling
cmdInput.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const cmd = cmdInput.value;
    cmdInput.value = '';
    await executeCommand(cmd);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx > 0) {
      historyIdx--;
      cmdInput.value = history[historyIdx];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx < history.length - 1) {
      historyIdx++;
      cmdInput.value = history[historyIdx];
    } else {
      historyIdx = history.length;
      cmdInput.value = '';
    }
  }
});

// Focus input on click
document.body.addEventListener('click', () => {
  cmdInput.focus();
});
</script>
</body>
</html>
